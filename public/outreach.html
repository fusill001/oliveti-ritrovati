<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oliveti Ritrovati — Outreach WA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --nero: #1a1a1a; --nero2: #242424; --nero3: #2e2e2e;
    --oro: #C4A84A; --oro-dim: rgba(196,168,74,0.12); --oro-dim2: rgba(196,168,74,0.06);
    --bianco: #f0ede8; --grigio: #8a8680; --grigio2: #5a5754;
    --verde: #4caf7d; --verde-dim: rgba(76,175,125,0.12);
    --rosso: #e05555; --rosso-dim: rgba(224,85,85,0.12);
    --verde-olivo: #7aab5a; --verde-olivo-dim: rgba(122,171,90,0.12);
    --radius: 12px; --radius-sm: 8px;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; font-family:'Inter',system-ui,sans-serif; background:var(--nero); color:var(--bianco); }
  .app { display:grid; grid-template-rows:auto auto 1fr; height:100vh; overflow:hidden; }

  /* HEADER */
  .header {
    background:var(--nero2); border-bottom:1px solid rgba(196,168,74,0.15);
    padding:12px 24px; display:flex; align-items:center; gap:20px; flex-wrap:wrap;
  }
  .logo { display:flex; align-items:center; gap:10px; font-size:15px; font-weight:700; color:var(--oro); letter-spacing:.04em; white-space:nowrap; }
  .progress-wrap { flex:1; min-width:180px; }
  .progress-label { display:flex; justify-content:space-between; font-size:11px; color:var(--grigio); margin-bottom:5px; }
  .progress-label strong { color:var(--bianco); font-size:13px; }
  .progress-bar { height:6px; background:var(--nero3); border-radius:100em; overflow:hidden; }
  .progress-fill { height:100%; border-radius:100em; transition:width .4s ease; }
  .fill-olio { background:var(--oro); }
  .fill-novellolio { background:var(--verde-olivo); }
  .stats-chips { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { font-size:11px; font-weight:600; padding:4px 10px; border-radius:100em; }
  .chip-inviato { background:var(--verde-dim); color:var(--verde); }
  .chip-skip { background:var(--oro-dim); color:var(--oro); }
  .chip-no { background:var(--rosso-dim); color:var(--rosso); }
  .chip-tot { background:rgba(255,255,255,.06); color:var(--grigio); }

  /* TABS */
  .tabs {
    background:var(--nero2); border-bottom:1px solid rgba(255,255,255,.06);
    padding:0 24px; display:flex; gap:0;
  }
  .tab {
    padding:12px 20px; font-size:13px; font-weight:600; cursor:pointer;
    border-bottom:2px solid transparent; color:var(--grigio); transition:all .15s;
    display:flex; align-items:center; gap:8px;
  }
  .tab:hover { color:var(--bianco); }
  .tab.active-olio { color:var(--oro); border-bottom-color:var(--oro); }
  .tab.active-novellolio { color:var(--verde-olivo); border-bottom-color:var(--verde-olivo); }
  .tab-badge {
    font-size:10px; font-weight:700; padding:2px 7px; border-radius:100em;
  }
  .tab-badge-olio { background:var(--oro-dim); color:var(--oro); }
  .tab-badge-nov { background:var(--verde-olivo-dim); color:var(--verde-olivo); }

  /* MAIN */
  .main { display:grid; grid-template-columns:280px 1fr; overflow:hidden; }

  /* SIDEBAR */
  .sidebar { background:var(--nero2); border-right:1px solid rgba(255,255,255,.06); display:flex; flex-direction:column; overflow:hidden; }
  .sidebar-top { padding:16px; border-bottom:1px solid rgba(255,255,255,.06); }
  .search-wrap { position:relative; margin-bottom:12px; }
  .search-wrap svg { position:absolute; left:10px; top:50%; transform:translateY(-50%); opacity:.4; pointer-events:none; }
  .search { width:100%; background:var(--nero3); border:1px solid rgba(255,255,255,.08); color:var(--bianco); border-radius:var(--radius-sm); padding:8px 10px 8px 34px; font-size:13px; outline:none; }
  .search:focus { border-color:var(--oro); }
  .search::placeholder { color:var(--grigio2); }
  .filters { display:flex; flex-direction:column; gap:8px; }
  .filter-row { display:flex; gap:6px; flex-wrap:wrap; }
  .filter-label { font-size:10px; font-weight:600; color:var(--grigio2); letter-spacing:.08em; text-transform:uppercase; margin-bottom:2px; }
  .fbtn { font-size:11px; font-weight:500; padding:4px 9px; border-radius:100em; border:1px solid rgba(255,255,255,.1); background:transparent; color:var(--grigio); cursor:pointer; transition:all .15s; }
  .fbtn:hover { border-color:var(--oro); color:var(--oro); }
  .fbtn.active { background:var(--oro-dim); border-color:var(--oro); color:var(--oro); }
  .fbtn-stato { font-size:11px; font-weight:500; padding:4px 9px; border-radius:100em; border:1px solid rgba(255,255,255,.1); background:transparent; color:var(--grigio); cursor:pointer; transition:all .15s; }
  .fbtn-stato.active { background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.2); color:var(--bianco); }
  .fbtn-stato.active-inviato { background:var(--verde-dim); border-color:var(--verde); color:var(--verde); }
  .fbtn-stato.active-skip { background:var(--oro-dim); border-color:var(--oro); color:var(--oro); }
  .fbtn-stato.active-no { background:var(--rosso-dim); border-color:var(--rosso); color:var(--rosso); }
  .list-wrap { flex:1; overflow-y:auto; padding:8px; }
  .list-wrap::-webkit-scrollbar { width:4px; }
  .list-wrap::-webkit-scrollbar-thumb { background:var(--nero3); border-radius:2px; }
  .contact-row { padding:10px 12px; border-radius:var(--radius-sm); cursor:pointer; transition:background .12s; display:flex; flex-direction:column; gap:3px; border:1px solid transparent; }
  .contact-row:hover { background:rgba(255,255,255,.04); }
  .contact-row.active { background:var(--oro-dim2); border-color:rgba(196,168,74,.2); }
  .row-name { font-size:13px; font-weight:600; color:var(--bianco); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row-meta { font-size:11px; color:var(--grigio); display:flex; gap:6px; align-items:center; }
  .row-stato { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .stato-nuovo { background:var(--grigio2); }
  .stato-inviato { background:var(--verde); }
  .stato-skip { background:var(--oro); }
  .stato-no { background:var(--rosso); }
  .empty-list { padding:24px; text-align:center; color:var(--grigio2); font-size:13px; }

  /* CONTENT */
  .content { overflow-y:auto; padding:32px; display:flex; flex-direction:column; gap:24px; }
  .content::-webkit-scrollbar { width:4px; }
  .content::-webkit-scrollbar-thumb { background:var(--nero3); border-radius:2px; }
  .no-selection { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:12px; color:var(--grigio2); text-align:center; }
  .no-selection svg { opacity:.3; }
  .no-selection p { font-size:14px; }

  /* CARD */
  .card { background:var(--nero2); border:1px solid rgba(255,255,255,.07); border-radius:16px; padding:28px; }
  .card-title { font-size:22px; font-weight:700; color:var(--bianco); line-height:1.2; }
  .card-badges { display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
  .badge { font-size:11px; font-weight:600; padding:3px 10px; border-radius:100em; }
  .badge-tipo { background:var(--oro-dim); color:var(--oro); }
  .badge-citta { background:rgba(255,255,255,.07); color:var(--grigio); }
  .badge-rating { background:rgba(255,200,0,.1); color:#ffd43b; }
  .stato-banner { padding:10px 14px; border-radius:var(--radius-sm); font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px; margin-bottom:16px; }
  .banner-inviato { background:var(--verde-dim); color:var(--verde); border:1px solid rgba(76,175,125,.2); }
  .banner-skip { background:var(--oro-dim); color:var(--oro); border:1px solid rgba(196,168,74,.2); }
  .banner-no { background:var(--rosso-dim); color:var(--rosso); border:1px solid rgba(224,85,85,.2); }
  .info-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:20px 0; }
  .info-item { background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.06); border-radius:var(--radius-sm); padding:12px; }
  .info-label { font-size:10px; font-weight:600; color:var(--grigio2); text-transform:uppercase; letter-spacing:.08em; margin-bottom:4px; }
  .info-value { font-size:14px; color:var(--bianco); font-weight:500; }
  .info-link { color:var(--oro); text-decoration:none; font-size:13px; }
  .info-link:hover { text-decoration:underline; }

  /* NOVELLOLIO banner */
  .nov-banner {
    background: linear-gradient(135deg, rgba(122,171,90,.1), rgba(196,168,74,.08));
    border:1px solid rgba(122,171,90,.25); border-radius:var(--radius-sm);
    padding:14px 16px; margin-bottom:16px;
    display:flex; align-items:flex-start; gap:12px;
  }
  .nov-banner-icon { font-size:24px; flex-shrink:0; }
  .nov-banner-text { font-size:12px; color:var(--grigio); line-height:1.5; }
  .nov-banner-text strong { color:var(--verde-olivo); }

  .msg-section { margin-bottom:20px; }
  .msg-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .msg-title { font-size:12px; font-weight:600; color:var(--grigio); text-transform:uppercase; letter-spacing:.08em; }
  .msg-body { background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.08); border-radius:var(--radius-sm); padding:14px 16px; font-size:14px; line-height:1.65; color:var(--bianco); white-space:pre-wrap; }
  .btn-copy { font-size:11px; font-weight:600; padding:5px 12px; border-radius:100em; border:1px solid rgba(255,255,255,.12); background:transparent; color:var(--grigio); cursor:pointer; transition:all .15s; display:flex; align-items:center; gap:5px; }
  .btn-copy:hover { color:var(--bianco); border-color:rgba(255,255,255,.25); }
  .btn-copy.copied { color:var(--verde); border-color:var(--verde); background:var(--verde-dim); }

  .azioni { display:flex; gap:10px; flex-wrap:wrap; }
  .btn-wa { flex:1; min-width:200px; background:#25D366; color:#fff; font-weight:700; font-size:15px; padding:14px 20px; border-radius:var(--radius); border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; transition:background .15s; text-decoration:none; }
  .btn-wa:hover { background:#1db954; }
  .btn-inviato { background:var(--verde-dim); color:var(--verde); border:1.5px solid rgba(76,175,125,.3); font-weight:600; font-size:14px; padding:14px 18px; border-radius:var(--radius); cursor:pointer; transition:all .15s; display:flex; align-items:center; gap:8px; white-space:nowrap; }
  .btn-inviato:hover { background:rgba(76,175,125,.2); }
  .btn-inviato.active { background:var(--verde); color:#fff; }
  .azioni2 { display:flex; gap:8px; }
  .btn-skip { flex:1; background:transparent; color:var(--grigio); border:1px solid rgba(255,255,255,.1); font-weight:500; font-size:13px; padding:10px; border-radius:var(--radius-sm); cursor:pointer; transition:all .15s; display:flex; align-items:center; justify-content:center; gap:6px; }
  .btn-skip:hover { border-color:var(--oro); color:var(--oro); }
  .btn-skip.active { background:var(--oro-dim); border-color:var(--oro); color:var(--oro); }
  .btn-no { flex:1; background:transparent; color:var(--grigio); border:1px solid rgba(255,255,255,.1); font-weight:500; font-size:13px; padding:10px; border-radius:var(--radius-sm); cursor:pointer; transition:all .15s; display:flex; align-items:center; justify-content:center; gap:6px; }
  .btn-no:hover { border-color:var(--rosso); color:var(--rosso); }
  .btn-no.active { background:var(--rosso-dim); border-color:var(--rosso); color:var(--rosso); }
  .btn-reset { background:transparent; color:var(--grigio2); border:none; font-size:12px; cursor:pointer; padding:10px; transition:color .15s; display:flex; align-items:center; gap:5px; }
  .btn-reset:hover { color:var(--grigio); }
  .nav-btns { display:flex; gap:8px; justify-content:space-between; align-items:center; padding-top:12px; border-top:1px solid rgba(255,255,255,.06); margin-top:16px; }
  .btn-nav { background:var(--nero3); color:var(--grigio); border:1px solid rgba(255,255,255,.08); font-size:13px; font-weight:500; padding:8px 16px; border-radius:var(--radius-sm); cursor:pointer; transition:all .15s; display:flex; align-items:center; gap:6px; }
  .btn-nav:hover { color:var(--bianco); border-color:rgba(255,255,255,.2); }
  .btn-nav:disabled { opacity:.3; cursor:default; }
  .nav-pos { font-size:13px; color:var(--grigio); }

  @media(max-width:768px) {
    .main { grid-template-columns:1fr; }
    .sidebar { display:none; }
    .content { padding:16px; }
    .info-grid { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <circle cx="11" cy="11" r="10" stroke="#C4A84A" stroke-width="1.5"/>
        <path d="M11 4c0 0-4 3-4 7s4 7 4 7" stroke="#C4A84A" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M11 4c0 0 4 3 4 7s-4 7-4 7" stroke="#C4A84A" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="7" y1="11" x2="15" y2="11" stroke="#C4A84A" stroke-width="1.5"/>
      </svg>
      Oliveti Ritrovati
    </div>
    <div class="progress-wrap">
      <div class="progress-label">
        <span id="prog-label">Olio — progresso</span>
        <strong id="prog-text">0 / 483</strong>
      </div>
      <div class="progress-bar"><div class="progress-fill fill-olio" id="prog-fill" style="width:0%"></div></div>
    </div>
    <div class="stats-chips">
      <span class="chip chip-inviato" id="stat-inviato">✓ 0</span>
      <span class="chip chip-skip" id="stat-skip">⏭ 0</span>
      <span class="chip chip-no" id="stat-no">✗ 0</span>
      <span class="chip chip-tot">📱 483</span>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active-olio" id="tab-olio" onclick="switchTab('olio')">
      🫒 Extravergine
      <span class="tab-badge tab-badge-olio" id="tbadge-olio">0</span>
    </div>
    <div class="tab" id="tab-novellolio" onclick="switchTab('novellolio')">
      🌿 Novellolio
      <span class="tab-badge tab-badge-nov" id="tbadge-nov">0</span>
    </div>
  </div>

  <div class="main">
    <div class="sidebar">
      <div class="sidebar-top">
        <div class="search-wrap">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4.5" stroke="#8a8680" stroke-width="1.5"/><path d="M9.5 9.5L12 12" stroke="#8a8680" stroke-width="1.5" stroke-linecap="round"/></svg>
          <input class="search" type="text" id="search" placeholder="Cerca nome o città…">
        </div>
        <div class="filters">
          <div>
            <div class="filter-label">Tipo</div>
            <div class="filter-row" id="filter-tipo">
              <button class="fbtn active" data-tipo="">Tutti</button>
              <button class="fbtn" data-tipo="ristorante">Ristorante</button>
              <button class="fbtn" data-tipo="agriturismo">Agriturismo</button>
              <button class="fbtn" data-tipo="enoteca">Enoteca</button>
              <button class="fbtn" data-tipo="wine bar">Wine Bar</button>
              <button class="fbtn" data-tipo="hotel">Hotel</button>
            </div>
          </div>
          <div>
            <div class="filter-label">Stato</div>
            <div class="filter-row" id="filter-stato">
              <button class="fbtn-stato active" data-stato="">Tutti</button>
              <button class="fbtn-stato" data-stato="nuovo">Da fare</button>
              <button class="fbtn-stato active-inviato" data-stato="inviato" style="display:none" id="fs-inviato">Inviati</button>
              <button class="fbtn-stato active-skip" data-stato="skip" style="display:none" id="fs-skip">Saltati</button>
              <button class="fbtn-stato active-no" data-stato="no" style="display:none" id="fs-no">Non int.</button>
            </div>
          </div>
        </div>
      </div>
      <div class="list-wrap" id="contact-list"></div>
    </div>

    <div class="content" id="content">
      <div class="no-selection" id="no-sel">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="22" stroke="#5a5754" stroke-width="1.5"/><path d="M24 14v10l6 4" stroke="#5a5754" stroke-width="2" stroke-linecap="round"/></svg>
        <p>Seleziona un contatto dalla lista<br>o usa i filtri per iniziare</p>
      </div>
      <div id="card-wrap" style="display:none"></div>
    </div>
  </div>
</div>

const MSG = {
  olio: "Salve, sono Francesco Linzalone di Oliveti Ritrovati \u2014 Matera.\n\nHo recuperato 3000 olivi centenari abbandonati nella campagna materana. Dal nostro frantoio di famiglia (Sassi, dal 1959) produciamo un extravergine con variet\u00e0 autoctone, zero additivi, molitura entro 8 ore.\n\nPremio OLIVARUM 2023. Produzione limitata.\n\nPosso portarvi una bottiglia da assaggiare?",
  novellolio: "Salve, sono Francesco Linzalone \u2014 produttore di olio extravergine a Matera, frantoio di famiglia dal 1959.\n\nLe scrivo per *Novellolio*: una serata dedicata al nuovo olio della stagione, che organizzo ogni anno da ottobre in poi.\n\nCome funziona: porto oli di produttori diversi, guido la degustazione, e i partecipanti votano in tempo reale tramite un'app \u2014 alla fine esce una classifica, vince il migliore della serata. Tra un assaggio e l'altro, racconti, poesie e detti sull'ulivo e sulla terra. Non una conferenza \u2014 una serata vera.\n\nLa formula si adatta: pu\u00f2 organizzarla lei portando i suoi clienti, posso farlo io portando il mio pubblico, oppure ci mettiamo insieme e riempiamo la sala in due. Il ristorante guadagna una serata fuori dall'ordinario. Noi portiamo l'olio nuovo.\n\nHa uno spazio e una data libera tra ottobre e novembre?"
};

const STORAGE_KEY = 'or_outreach_v3';
let state = {};
try { state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e) {}
// state[tab][tel] = 'nuovo'|'inviato'|'skip'|'no'
if (!state.olio) state.olio = {};
if (!state.novellolio) state.novellolio = {};

let currentTab = 'olio';
let filteredList = [];
let currentIdx = 0;
let filterTipo = '';
let filterStato = '';
let searchQ = '';

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

function getStato(c) {
  return state[currentTab][c.telefono] || 'nuovo';
}

function setStato(c, s) {
  state[currentTab][c.telefono] = s;
  save();
  updateStats();
  renderList();
  renderCard(currentIdx);
}

function switchTab(tab) {
  currentTab = tab;
  currentIdx = 0;
  filterTipo = '';
  filterStato = '';
  searchQ = '';
  document.getElementById('search').value = '';
  document.querySelectorAll('#filter-tipo .fbtn').forEach(b => b.classList.toggle('active', b.dataset.tipo === ''));
  document.querySelectorAll('#filter-stato .fbtn-stato').forEach((b,i) => b.classList.toggle('active', i===0));

  const isNov = tab === 'novellolio';
  document.getElementById('tab-olio').className = 'tab' + (isNov ? '' : ' active-olio');
  document.getElementById('tab-novellolio').className = 'tab' + (isNov ? ' active-novellolio' : '');
  document.getElementById('prog-fill').className = 'progress-fill ' + (isNov ? 'fill-novellolio' : 'fill-olio');
  document.getElementById('prog-label').textContent = (isNov ? 'Novellolio' : 'Olio') + ' — progresso';

  // mostra/nascondi filtri stato dopo primo uso
  ['fs-inviato','fs-skip','fs-no'].forEach(id => document.getElementById(id).style.display = '');

  updateStats();
  renderList();
  renderCard(0);
}

function updateStats() {
  const st = state[currentTab];
  const inviati = CONTACTS.filter(c => st[c.telefono] === 'inviato').length;
  const skips   = CONTACTS.filter(c => st[c.telefono] === 'skip').length;
  const no      = CONTACTS.filter(c => st[c.telefono] === 'no').length;
  const tot = CONTACTS.length;
  document.getElementById('prog-text').textContent = inviati + ' / ' + tot;
  document.getElementById('prog-fill').style.width = (inviati/tot*100).toFixed(1)+'%';
  document.getElementById('stat-inviato').textContent = '✓ ' + inviati;
  document.getElementById('stat-skip').textContent    = '⏭ ' + skips;
  document.getElementById('stat-no').textContent      = '✗ ' + no;
  // tab badges
  document.getElementById('tbadge-olio').textContent = CONTACTS.filter(c => state.olio[c.telefono] === 'inviato').length;
  document.getElementById('tbadge-nov').textContent  = CONTACTS.filter(c => state.novellolio[c.telefono] === 'inviato').length;
}

function applyFilters() {
  filteredList = CONTACTS.filter(c => {
    if (filterTipo && !c.tipo.toLowerCase().includes(filterTipo)) return false;
    if (filterStato) {
      const s = getStato(c);
      if (s !== filterStato) return false;
    }
    if (searchQ) {
      const q = searchQ.toLowerCase();
      if (!c.nome.toLowerCase().includes(q) && !c.citta.toLowerCase().includes(q)) return false;
    }
    return true;
  });
}

function renderList() {
  applyFilters();
  const el = document.getElementById('contact-list');
  if (!filteredList.length) { el.innerHTML = '<div class="empty-list">Nessun contatto trovato</div>'; return; }
  el.innerHTML = filteredList.map((c,i) => {
    const s = getStato(c);
    return `<div class="contact-row ${i===currentIdx?'active':''}" onclick="selectContact(${i})">
      <div class="row-name">${c.nome}</div>
      <div class="row-meta"><div class="row-stato stato-${s}"></div><span>${c.tipo}</span>·<span>${c.citta}</span></div>
    </div>`;
  }).join('');
}

function selectContact(idx) {
  currentIdx = idx;
  renderList();
  renderCard(idx);
  // scroll row into view
  const rows = document.querySelectorAll('.contact-row');
  if (rows[idx]) rows[idx].scrollIntoView({block:'nearest'});
}

function renderCard(idx) {
  const noSel = document.getElementById('no-sel');
  const wrap  = document.getElementById('card-wrap');
  if (idx < 0 || idx >= filteredList.length) {
    noSel.style.display = 'flex'; wrap.style.display = 'none'; return;
  }
  noSel.style.display = 'none';
  wrap.style.cssText = 'display:flex;flex-direction:column;gap:16px';

  const c   = filteredList[idx];
  const s   = getStato(c);
  const msg = MSG[currentTab];
  const waUrl = 'https://wa.me/' + c.telefono.replace('+','') + '?text=' + encodeURIComponent(msg);

  const bannerHtml = s !== 'nuovo' ? `<div class="stato-banner ${s==='inviato'?'banner-inviato':s==='skip'?'banner-skip':'banner-no'}">
    ${s==='inviato'?'✅ Inviato':s==='skip'?'⏭ Saltato':'❌ Non interessato'}
    <button class="btn-reset" onclick="setStato(filteredList[${idx}],'nuovo')">↩ Annulla</button>
  </div>` : '';

  const novBanner = currentTab === 'novellolio' ? `<div class="nov-banner">
    <div class="nov-banner-icon">🌿</div>
    <div class="nov-banner-text"><strong>Proposta Novellolio</strong> — stai proponendo la serata di degustazione del nuovo raccolto.<br>Ideale da ottobre: ristoranti, enoteche, agriturismi con spazio eventi.</div>
  </div>` : '';

  const ratingHtml = c.rating ? `<span class="badge badge-rating">⭐ ${c.rating} (${c.recensioni})</span>` : '';

  wrap.innerHTML = `<div class="card">
    <div style="margin-bottom:20px">
      <div class="card-title">${c.nome}</div>
      <div class="card-badges">
        <span class="badge badge-tipo">${c.tipo}</span>
        <span class="badge badge-citta">📍 ${c.citta}</span>
        ${ratingHtml}
      </div>
    </div>
    ${bannerHtml}
    ${novBanner}
    <div class="info-grid">
      <div class="info-item">
        <div class="info-label">Telefono</div>
        <div class="info-value">${c.telefono}</div>
      </div>
      <div class="info-item">
        <div class="info-label">Sito web</div>
        <div class="info-value">${c.sito_web ? `<a href="https://${c.sito_web}" target="_blank" class="info-link">${c.sito_web}</a>` : '—'}</div>
      </div>
      <div class="info-item" style="grid-column:1/-1">
        <div class="info-label">Indirizzo</div>
        <div class="info-value">${c.indirizzo||c.citta}${c.maps_url?` <a href="${c.maps_url}" target="_blank" class="info-link" style="margin-left:8px">→ Maps</a>`:''}</div>
      </div>
    </div>
    <div class="msg-section">
      <div class="msg-header">
        <span class="msg-title">Messaggio WhatsApp</span>
        <button class="btn-copy" id="copy-btn" onclick="copyMsg('${c.telefono}')">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="1" y="3" width="7" height="8" rx="1" stroke="currentColor" stroke-width="1.2"/><path d="M4 3V2a1 1 0 011-1h5a1 1 0 011 1v7a1 1 0 01-1 1H9" stroke="currentColor" stroke-width="1.2"/></svg>
          Copia
        </button>
      </div>
      <div class="msg-body">${msg}</div>
    </div>
    <div class="azioni">
      <a class="btn-wa" href="${waUrl}" target="_blank">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        Apri WhatsApp
      </a>
      <button class="btn-inviato ${s==='inviato'?'active':''}" onclick="markInviato(${idx})">✅ Segna inviato</button>
    </div>
    <div class="azioni2" style="margin-top:8px">
      <button class="btn-skip ${s==='skip'?'active':''}" onclick="setStato(filteredList[${idx}],'skip')">⏭ Salta</button>
      <button class="btn-no ${s==='no'?'active':''}" onclick="setStato(filteredList[${idx}],'no')">✗ Non interessato</button>
    </div>
    <div class="nav-btns">
      <button class="btn-nav" onclick="prevContact()" ${idx===0?'disabled':''}>← Prec.</button>
      <span class="nav-pos">${idx+1} / ${filteredList.length}</span>
      <button class="btn-nav" onclick="nextContact()" ${idx===filteredList.length-1?'disabled':''}>Pros. →</button>
    </div>
  </div>`;
}

function markInviato(idx) {
  setStato(filteredList[idx], 'inviato');
  setTimeout(() => {
    const next = filteredList.findIndex((x,i) => i > idx && getStato(x) === 'nuovo');
    selectContact(next !== -1 ? next : Math.min(idx+1, filteredList.length-1));
  }, 300);
}

function nextContact() { if (currentIdx < filteredList.length-1) selectContact(currentIdx+1); }
function prevContact() { if (currentIdx > 0) selectContact(currentIdx-1); }

function copyMsg(tel) {
  navigator.clipboard.writeText(MSG[currentTab]).then(() => {
    const btn = document.getElementById('copy-btn');
    if (!btn) return;
    btn.classList.add('copied'); btn.textContent = '✓ Copiato';
    setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="1" y="3" width="7" height="8" rx="1" stroke="currentColor" stroke-width="1.2"/><path d="M4 3V2a1 1 0 011-1h5a1 1 0 011 1v7a1 1 0 01-1 1H9" stroke="currentColor" stroke-width="1.2"/></svg> Copia'; }, 2000);
  }).catch(() => {
    const ta = document.createElement('textarea'); ta.value = MSG[currentTab];
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}

document.getElementById('filter-tipo').addEventListener('click', e => {
  const btn = e.target.closest('[data-tipo]'); if (!btn) return;
  document.querySelectorAll('#filter-tipo .fbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active'); filterTipo = btn.dataset.tipo; currentIdx=0; renderList(); renderCard(0);
});

document.getElementById('filter-stato').addEventListener('click', e => {
  const btn = e.target.closest('[data-stato]'); if (!btn) return;
  document.querySelectorAll('#filter-stato .fbtn-stato').forEach(b => b.classList.remove('active','active-inviato','active-skip','active-no'));
  const s = btn.dataset.stato; filterStato = s;
  btn.classList.add(s==='inviato'?'active-inviato':s==='skip'?'active-skip':s==='no'?'active-no':'active');
  currentIdx=0; renderList(); renderCard(0);
});

document.getElementById('search').addEventListener('input', e => {
  searchQ = e.target.value.trim(); currentIdx=0; renderList(); renderCard(0);
});

document.addEventListener('keydown', e => {
  if (e.target.tagName==='INPUT') return;
  if (e.key==='ArrowRight'||e.key==='j') nextContact();
  if (e.key==='ArrowLeft'||e.key==='k') prevContact();
  if (e.key==='Enter') markInviato(currentIdx);
});

// INIT
updateStats();
renderList();
